name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend integration + AI Action tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The API layer is intentionally dependency-free: there is nothing to
      # install, and both suites run TypeScript directly via Node type stripping.
      - name: Print Node version
        run: node --version

      - name: Integration suite (dashboard math, saved-meal cascades, RLS assumptions)
        run: npm test

      - name: AI Action smoke suite (server-derived provenance, spoof rejection, audit log)
        run: npm run test:ai-action
